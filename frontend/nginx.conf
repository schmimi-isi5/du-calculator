# Serves the built SPA and proxies /api to the backend service by its
# docker-compose service name, so the frontend image needs no build-time
# knowledge of the backend's public URL.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Repository analysis and scoring calls involve long-running AI
        # requests (see backend AnthropicProvider) - the default 60s proxy
        # timeout would cut them off mid-request.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
