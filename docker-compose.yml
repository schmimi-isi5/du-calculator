services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-du_calculator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-du_calculator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-du_calculator} -d ${POSTGRES_DB:-du_calculator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-du_calculator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-du_calculator}
      # Which AIProvider is active - see backend/src/ai/getAIProvider.ts. Only
      # the credential for the selected AI_PROVIDER actually needs a value;
      # config.ts validates that lazily on first AI call, not here, since a
      # docker-compose-level ":?required" would force ANTHROPIC_API_KEY even
      # when running with AI_PROVIDER=openai/openrouter/local.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      AI_CUSTOM_INPUT_PRICE_PER_MTOK: ${AI_CUSTOM_INPUT_PRICE_PER_MTOK:-}
      AI_CUSTOM_OUTPUT_PRICE_PER_MTOK: ${AI_CUSTOM_OUTPUT_PRICE_PER_MTOK:-}
      # Multi-LLM Model Registry (backend/src/domain/models.ts) - independent
      # of AI_PROVIDER above, each lets one more provider's models appear in
      # the per-requirement picker.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      # OpenRouter's model list is operator-configured, not fixed - uses
      # OPENROUTER_API_KEY above, plus exactly the model slugs to offer.
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # Local Ollama server - reachable from inside the container, so
      # "localhost" would point at the container itself, not the host
      # machine; override in .env with the host's real address.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
      LLM_ALLOW_PREMIUM_FALLBACK: ${LLM_ALLOW_PREMIUM_FALLBACK:-}
      PRICE_PER_DU: ${PRICE_PER_DU:-300}
      GIT_CLONE_TIMEOUT_MS: ${GIT_CLONE_TIMEOUT_MS:-60000}
      GIT_MAX_REPO_FILES: ${GIT_MAX_REPO_FILES:-5000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
